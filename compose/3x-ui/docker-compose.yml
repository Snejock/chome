services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:v3.4.2
    container_name: 3x-ui
    hostname: vm1.chome.pro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./db/:/etc/x-ui/
      - ./cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:2053"
      - "443:443"
      - "10808:10808"
      - "56080:56080"